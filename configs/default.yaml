seed: 42

model:
  model_id: openai/gpt-oss-20b
  dtype: bfloat16
  device_map: auto
  max_new_tokens: 256
  use_router_probs: true  # ignored if model doesn't expose MoE router probs
  # cache_dir: ./language_models/transformers   # (optional) set via env or here

probe:
  layers: [16, 24, 32]
  reducer: "concat"        # concat | mean | last
  model: "logreg"          # logreg | mlp
  train_size: 8000

# default threshold for gating (can override via CLI)
threshold: 0.5

# not used in closed-book; leaving here for future RAG experiments
rag:
  backend: "wikipedia"     # wikipedia | faiss
  top_k: 5
  max_passage_len: 384
  reanswer_prompt: "use_evidence_or_refuse"

data:
  dataset: "triviaqa"         # squad | nq_open | triviaqa
  split: "validation"
  limit: 12000             # cap to keep runs predictable (lower for quick debug)

logging:
  wandb: false

# optional gate defaults (scripts also accept CLI flags)
gate:
  variant: "baseline"       # baseline | mice
  base_layers: [16, 24, 32]
  mice_layers: [16, 24, 32]
  include_entropy: true
  n_best: 3
  probe_type: "cls"         # cls | sc
