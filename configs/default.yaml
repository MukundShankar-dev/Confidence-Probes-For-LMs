seed: 42

model:
  model_id: openai/gpt-oss-20b
  dtype: bfloat16
  device_map: auto
  max_new_tokens: 64
  use_router_probs: true  # ignored if model doesn't expose MoE router probs

probe:
  layers: [16, 24, 32]
  reducer: "concat"        # concat | mean | last
  model: "logreg"          # logreg | mlp
  train_size: 8000

threshold: 0.5

rag:
  backend: "wikipedia"     # wikipedia | faiss
  top_k: 5
  max_passage_len: 384
  reanswer_prompt: "use_evidence_or_refuse"

data:
  dataset: "squad"         # squad | nq_open | triviaqa
  split: "validation"
  limit: 12000

logging:
  wandb: false
